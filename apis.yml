aid: copperlane
name: Copperlane
description: >-
  Copperlane is an AI-native mortgage loan origination platform founded in 2025
  by Brianna Lin and Athan Zhang and backed by Y Combinator (W26 batch). Its AI
  agent, Penny, behaves like a real loan officer: it guides borrowers through
  intake, pulls and reads borrower documents, verifies loan eligibility in real
  time, answers borrower questions live, and generates Letters of Explanation,
  delivering cleaner files to human loan officers so they can focus on closing
  loans instead of chasing paperwork. The San Francisco company raised a $4.1M
  seed round to modernize a mortgage origination process that remains largely
  manual. Copperlane is currently a demo-request business application and does
  not publish a public developer API, SDK, or developer portal.
